<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f5">
  <title>AI 学习与职业工作台 · 四川大学人工智能</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f5;
      --surface: #ffffff;
      --surface-soft: #eef1ee;
      --surface-mute: #fafbfa;
      --text: #1e2521;
      --text-2: #414c45;
      --muted: #6d7770;
      --faint: #8d968f;
      --line: #e1e6e1;
      --line-soft: #edf1ed;
      --green: #26714f;
      --green-strong: #1c5a3e;
      --green-soft: #e5f1ea;
      --blue: #3c6491;
      --blue-soft: #e8eff6;
      --amber: #9c5f13;
      --amber-soft: #fbf0e0;
      --red: #ab4038;
      --red-soft: #f9eae8;
      --violet: #6a4a92;
      --violet-soft: #f0eaf7;
      --teal: #1f6f76;
      --teal-soft: #e4f2f3;
      --shadow-sm: 0 1px 2px rgb(24 39 29 / 5%);
      --shadow-md: 0 6px 20px rgb(24 39 29 / 8%);
      --shadow-lg: 0 18px 48px rgb(18 30 22 / 18%);
      --radius: 8px;
      --radius-sm: 5px;
      --sidebar-w: 244px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141715;
      --surface: #1c211e;
      --surface-soft: #262c28;
      --surface-mute: #191d1b;
      --text: #e9ede9;
      --text-2: #c3cbc5;
      --muted: #98a29b;
      --faint: #7f8983;
      --line: #2e3531;
      --line-soft: #262c28;
      --green: #5fbd8e;
      --green-strong: #7ccda4;
      --green-soft: #1e2f26;
      --blue: #7ba7d4;
      --blue-soft: #1e2833;
      --amber: #dda459;
      --amber-soft: #302719;
      --red: #e0897f;
      --red-soft: #33211f;
      --violet: #b79bdd;
      --violet-soft: #272130;
      --teal: #6cc0c6;
      --teal-soft: #182a2c;
      --shadow-sm: 0 1px 2px rgb(0 0 0 / 30%);
      --shadow-md: 0 6px 20px rgb(0 0 0 / 35%);
      --shadow-lg: 0 18px 48px rgb(0 0 0 / 55%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font: inherit; color: inherit; }
    button { color: inherit; cursor: pointer; }
    a { color: var(--blue); }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    }

    /* ---------- sidebar ---------- */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 12px 14px;
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 4px; }
    .brand-mark {
      width: 36px; height: 36px; flex: none;
      display: grid; place-items: center;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(140deg, var(--green), var(--teal));
      font-size: 15px; font-weight: 750; letter-spacing: .02em;
    }
    .brand-name { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
    .brand-caption { color: var(--faint); font-size: 10px; letter-spacing: .06em; }

    .nav-group { margin-bottom: 4px; }
    .nav-label {
      margin: 6px 10px 5px;
      color: var(--faint);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .nav { display: grid; gap: 2px; }
    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      font-size: 13px;
      transition: background .12s ease, color .12s ease;
    }
    .nav button:hover { background: var(--surface-soft); }
    .nav button.active { color: var(--green); background: var(--green-soft); font-weight: 650; }
    .nav-icon { width: 18px; text-align: center; font-size: 14px; flex: none; }
    .nav-badge {
      margin-left: auto;
      padding: 1px 6px;
      border-radius: 20px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }
    .nav button.active .nav-badge { background: var(--surface); color: var(--green); }

    .side-note {
      margin-top: auto;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-mute);
      font-size: 11px;
    }
    .side-note strong { display: block; margin-bottom: 3px; font-size: 11.5px; }
    .side-note span { color: var(--muted); display: block; }
    .side-note .side-line { margin-top: 6px; }

    /* ---------- main ---------- */
    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 6;
      height: 58px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .breadcrumb { color: var(--muted); font-size: 12px; }
    .breadcrumb b { color: var(--text); font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 8px; }

    .content {
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 24px 26px 64px;
    }

    .page-head {
      margin-bottom: 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.3; letter-spacing: -.01em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 12.5px; max-width: 78ch; }
    h2 { margin: 0; font-size: 14.5px; }
    h3 { margin: 0; font-size: 13px; }
    h4 { margin: 0; font-size: 12px; }

    /* ---------- buttons ---------- */
    .button {
      min-height: 32px;
      padding: 6px 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-2);
      font-size: 12.5px;
      white-space: nowrap;
      transition: background .12s ease, border-color .12s ease;
    }
    .button:hover { background: var(--surface-soft); }
    .button.primary { color: #fff; background: var(--green); border-color: var(--green); }
    .button.primary:hover { background: var(--green-strong); border-color: var(--green-strong); }
    .button.small { min-height: 27px; padding: 4px 8px; font-size: 11.5px; }
    .button.icon { width: 30px; min-height: 30px; padding: 0; font-size: 14px; }
    .button.icon.small { width: 24px; min-height: 24px; font-size: 12px; }
    .button.danger { color: var(--red); }
    .button.danger:hover { background: var(--red-soft); }
    .button.ghost { border-color: transparent; background: transparent; }
    .button.ghost:hover { background: var(--surface-soft); }
    .button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--green) 55%, transparent);
      outline-offset: 2px;
    }
    .btn-row { display: flex; gap: 7px; flex-wrap: wrap; }

    /* ---------- grid & panels ---------- */
    .grid { display: grid; gap: 13px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 13px; }
    .stats-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .two-col { grid-template-columns: minmax(0, 1.35fr) minmax(280px, .85fr); }
    .two-col-even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .four-col { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .panel, .stat-card {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .panel { padding: 16px; }
    .panel-head {
      margin-bottom: 13px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .panel-subtitle { margin-top: 3px; color: var(--muted); font-size: 11.5px; }
    .panel-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .stat-card { padding: 14px 15px; display: flex; flex-direction: column; gap: 6px; }
    .stat-label { color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 5px; }
    .stat-value { font-size: 24px; line-height: 1.05; font-weight: 720; letter-spacing: -.02em; }
    .stat-value .unit { font-size: 13px; font-weight: 500; color: var(--muted); }
    .stat-hint { color: var(--muted); font-size: 11px; }
    .stat-card.accent-green { border-left: 3px solid var(--green); }
    .stat-card.accent-blue { border-left: 3px solid var(--blue); }
    .stat-card.accent-amber { border-left: 3px solid var(--amber); }
    .stat-card.accent-violet { border-left: 3px solid var(--violet); }

    .section-gap { margin-top: 13px; }
    .empty { padding: 20px 8px; text-align: center; color: var(--muted); font-size: 12px; }

    /* ---------- progress ---------- */
    .progress-track { height: 7px; overflow: hidden; background: var(--surface-soft); border-radius: 20px; }
    .progress-fill { height: 100%; background: var(--green); border-radius: inherit; transition: width .25s ease; }
    .progress-fill.blue { background: var(--blue); }
    .progress-fill.amber { background: var(--amber); }
    .progress-fill.violet { background: var(--violet); }
    .progress-legend { margin-top: 7px; display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }

    .ring-wrap { display: flex; align-items: center; gap: 13px; }
    .ring { flex: none; }
    .ring-label { font-size: 11px; color: var(--muted); }

    /* ---------- tags ---------- */
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--surface-soft);
      color: var(--text-2);
      font-size: 10.5px;
      font-weight: 550;
      white-space: nowrap;
    }
    .tag.green { background: var(--green-soft); color: var(--green); }
    .tag.blue { background: var(--blue-soft); color: var(--blue); }
    .tag.amber { background: var(--amber-soft); color: var(--amber); }
    .tag.red { background: var(--red-soft); color: var(--red); }
    .tag.violet { background: var(--violet-soft); color: var(--violet); }
    .tag.teal { background: var(--teal-soft); color: var(--teal); }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; }

    /* ---------- rows / lists ---------- */
    .list { display: grid; }
    .row {
      padding: 9px 0;
      display: grid;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--line-soft);
    }
    .row:first-child { border-top: 0; }
    .row-cb { grid-template-columns: 20px minmax(0, 1fr) auto; }
    .row-cb2 { grid-template-columns: 20px minmax(0, 1fr) auto auto; }
    .row-title { font-size: 12.5px; font-weight: 600; }
    .row-title.done { color: var(--faint); text-decoration: line-through; font-weight: 500; }
    .row-detail { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .row-side { display: flex; align-items: center; gap: 6px; }
    input[type="checkbox"] { accent-color: var(--green); width: 15px; height: 15px; cursor: pointer; }
    input[type="range"] { width: 100%; accent-color: var(--green); }

    /* ---------- skills ---------- */
    .skill-row {
      display: grid;
      grid-template-columns: 132px minmax(80px, 1fr) 60px;
      align-items: center;
      gap: 11px;
      padding: 8px 0;
      border-top: 1px solid var(--line-soft);
    }
    .skill-row:first-child { border-top: 0; }
    .skill-name { font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .skill-score { color: var(--muted); text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
    .radar-box { display: grid; place-items: center; }

    /* ---------- charts ---------- */
    .bars { display: flex; align-items: flex-end; gap: 8px; height: 128px; padding-top: 6px; }
    .bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; }
    .bar-track { width: 100%; max-width: 44px; flex: 1; display: flex; align-items: flex-end; border-radius: 5px 5px 0 0; background: var(--surface-soft); }
    .bar-fill { width: 100%; border-radius: 5px 5px 0 0; background: var(--green); min-height: 3px; transition: height .25s ease; }
    .bar-fill.soft { background: color-mix(in srgb, var(--green) 35%, var(--surface-soft)); }
    .bar-label { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .bar-value { font-size: 10.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }

    /* ---------- habit grid ---------- */
    .habit-grid { display: grid; grid-template-columns: minmax(110px, 1.4fr) repeat(7, minmax(30px, 1fr)) 52px; gap: 5px; align-items: center; }
    .habit-head { font-size: 10.5px; color: var(--muted); text-align: center; font-weight: 600; }
    .habit-head.today { color: var(--green); }
    .habit-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .habit-cell {
      aspect-ratio: 1 / 1;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      display: grid; place-items: center;
      font-size: 11px; color: var(--faint);
    }
    .habit-cell:hover { border-color: var(--green); }
    .habit-cell.on { background: var(--green); border-color: var(--green); color: #fff; }
    .habit-cell.today { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--green) 30%, transparent); }
    .habit-streak { font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

    /* ---------- timeline ---------- */
    .timeline { position: relative; padding-left: 22px; display: grid; gap: 2px; }
    .timeline::before {
      content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px;
      background: var(--line); border-radius: 2px;
    }
    .tl-item { position: relative; padding: 8px 0 10px; }
    .tl-dot {
      position: absolute; left: -22px; top: 13px;
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--surface); border: 2.5px solid var(--line);
    }
    .tl-item.done .tl-dot { background: var(--green); border-color: var(--green); }
    .tl-item.soon .tl-dot { border-color: var(--amber); background: var(--amber); }
    .tl-item.overdue .tl-dot { border-color: var(--red); background: var(--red); }
    .tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tl-date { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tl-count { font-size: 10.5px; }

    /* ---------- cards ---------- */
    .card {
      display: flex; flex-direction: column;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      min-width: 0;
    }
    .card.selected { border-color: color-mix(in srgb, var(--green) 55%, var(--line)); background: color-mix(in srgb, var(--green-soft) 45%, var(--surface)); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card p { margin: 8px 0 10px; color: var(--muted); font-size: 11.5px; flex: 1; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; flex-wrap: wrap; }

    /* ---------- tables ---------- */
    .table-wrap { overflow-x: auto; margin: 0 -4px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 8px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
    th { color: var(--muted); font-size: 10.5px; font-weight: 650; white-space: nowrap; }
    td { font-size: 11.5px; }
    tbody tr:hover { background: var(--surface-mute); }
    td input, td select { width: 100%; min-width: 76px; padding: 5px 6px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); font-size: 11.5px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .tfoot td { border-bottom: 0; border-top: 2px solid var(--line); font-weight: 650; }
    .col-tight { width: 46px; }

    /* ---------- forms ---------- */
    .field { display: grid; gap: 4px; min-width: 0; }
    .field label { color: var(--text-2); font-size: 11px; font-weight: 600; }
    .field input, .field textarea, .field select {
      width: 100%; min-width: 0; padding: 7px 9px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface); font-size: 12.5px;
    }
    .field textarea { min-height: 74px; resize: vertical; line-height: 1.5; }
    .field .hint { color: var(--faint); font-size: 10.5px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .form-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .span-2 { grid-column: 1 / -1; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 11px; }
    .inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .toolbar .field { flex: 0 1 200px; }
    .search { display: flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .search input { border: 0; background: transparent; outline: none; width: 100%; font-size: 12.5px; }

    /* ---------- modal ---------- */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 40;
      background: rgb(14 22 17 / 45%);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      width: min(520px, 100%);
      max-height: min(84vh, 760px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      padding: 18px;
    }
    .modal h2 { font-size: 16px; }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }

    /* ---------- timer ---------- */
    .timer-widget {
      position: fixed; right: 18px; bottom: 18px; z-index: 30;
      width: 232px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 13px;
      display: none;
    }
    .timer-widget.show { display: block; }
    .timer-time { font-size: 33px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.1; }
    .timer-phase { text-align: center; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .timer-ring { display: block; margin: 6px auto 4px; }
    .timer-actions { display: flex; gap: 6px; justify-content: center; margin-top: 9px; }
    .timer-meta { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 10.5px; text-align: center; }

    /* ---------- toast ---------- */
    .toast {
      position: fixed; left: 50%; bottom: 22px; z-index: 60;
      transform: translate(-50%, 10px);
      padding: 9px 15px;
      border-radius: 20px;
      background: #22322a;
      color: #fff;
      box-shadow: var(--shadow-md);
      font-size: 12.5px;
      opacity: 0; pointer-events: none;
      transition: .18s ease;
      max-width: 82vw;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .kbd { padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--surface-mute); font-size: 10.5px; font-family: ui-monospace, monospace; }
    .sep { height: 1px; background: var(--line-soft); margin: 12px 0; }
    .note-text { white-space: pre-wrap; font-size: 12px; color: var(--text-2); }
    .mobile-menu { display: none; }
    .muted { color: var(--muted); }
    .nowrap { white-space: nowrap; }
    .right { text-align: right; }
    .center { text-align: center; }
    .scroll-y { max-height: 340px; overflow-y: auto; }
    .scroll-y-sm { max-height: 240px; overflow-y: auto; }

    @media (max-width: 1080px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .three-col { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .four-col { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 196px minmax(0, 1fr); }
      .content { padding-inline: 18px; }
      .topbar { padding-inline: 18px; }
      .two-col, .two-col-even { grid-template-columns: 1fr; }
    }

  function uid() {
    return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }
  function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, Number(n) || 0)); }
  function round(n, d = 2) { const p = 10 ** d; return Math.round((Number(n) || 0) * p) / p; }
  function pad2(n) { return String(n).padStart(2, "0"); }

  function toISO(date) {
    const d = date instanceof Date ? date : new Date(date);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function todayISO() { return toISO(new Date()); }

  function parseISO(s) {
    if (!s) return null;
    const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return Number.isNaN(d.getTime()) ? null : d;
  }
  function daysFromToday(iso) {
    const d = parseISO(iso);
    if (!d) return null;
    const t = new Date();
    const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((a - b) / 86400000);
  }
  function fmtDate(iso, withWeek = false) {
    const d = parseISO(iso);
    if (!d) return "—";
    const w = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
    return `${d.getMonth() + 1}月${d.getDate()}日${withWeek ? ` 周${w}` : ""}`;
  }
  function escapeHtml(value = "") {
    return String(value).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function num(v, fallback = 0) {
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  }
  function sortByDate(list, key = "date", dir = 1) {
    return [...list].sort((a, b) => {
      const da = parseISO(a[key]), db = parseISO(b[key]);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return (da - db) * dir;
    });
  }

  /* 百分制 -> 4.0 绩点（国内高校常见换算表，可在设置中切换为原始百分制参考） */
  const GPA_TABLE = [
    { min: 90, gp: 4.0 }, { min: 85, gp: 3.7 }, { min: 82, gp: 3.3 }, { min: 78, gp: 3.0 },
    { min: 75, gp: 2.7 }, { min: 72, gp: 2.3 }, { min: 68, gp: 2.0 }, { min: 64, gp: 1.5 },
    { min: 60, gp: 1.0 }, { min: 0, gp: 0 }
  ];
  function scoreToGp(score) {
    const s = num(score, -1);
    if (s < 0) return 0;
    for (const row of GPA_TABLE) if (s >= row.min) return row.gp;
    return 0;
  }

  /* 学期：由入学年份推导，共 8 个学期 */
  function termList(enrollYear) {
    const y0 = num(enrollYear, new Date().getFullYear());
    const grades = ["大一", "大二", "大三", "大四"];
    const out = [];
    for (let i = 0; i < 4; i++) {
      out.push({ id: `${y0 + i}-秋`, label: `${grades[i]}上`, sub: `${y0 + i} 秋`, year: y0 + i, half: "秋", index: i * 2 });
      out.push({ id: `${y0 + i + 1}-春`, label: `${grades[i]}下`, sub: `${y0 + i + 1} 春`, year: y0 + i + 1, half: "春", index: i * 2 + 1 });
    }
    return out;
  }
  function termIndex(enrollYear, termId) {
    const list = termList(enrollYear);
    const hit = list.find(t => t.id === termId);
    return hit ? hit.index : 0;
  }
  function currentTermId(enrollYear) {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth() + 1;
    let year, half;
    /* 秋季学期约 9 月—次年 1 月；春季学期约 2 月—7 月 */
    if (m >= 9 && m <= 12) { half = "秋"; year = y; }
    else if (m === 1) { half = "秋"; year = y - 1; }
    else { half = "春"; year = y; }
    const y0 = num(enrollYear, y);
    /* 大一下起，春季学期落在入学年份 +1，因此春学期索引要减一 */
    let idx = half === "秋" ? (year - y0) * 2 : (year - y0) * 2 - 1;
    idx = Math.min(7, Math.max(0, idx));
    const list = termList(y0);
    return list[idx] ? list[idx].id : `${y0}-秋`;
  }

  /* ============================================================
     3. 迁移与持久化
     ============================================================ */
  function migrate(raw) {
    const base = defaultData();
    if (!raw || typeof raw !== "object") return base;

    /* v1 -> v2 */
    const next = base;
    if (raw.profile && typeof raw.profile === "object") {
      const p = raw.profile;
      if (p.school) next.profile.school = String(p.school);
      if (p.major) next.profile.major = String(p.major);
      if (p.year) next.profile.grade = String(p.year);
      if (p.weeklyHours) next.profile.weeklyHours = clamp(p.weeklyHours, 1, 80);
      if (p.target) next.profile.target = String(p.target);
      if (p.college) next.profile.college = String(p.college);
      if (p.campus) next.profile.campus = String(p.campus);
      if (p.enrollYear) next.profile.enrollYear = num(p.enrollYear, 2026);
    }
    const terms = termList(next.profile.enrollYear);
    if (Array.isArray(raw.skills) && raw.skills.length) {
      next.skills = raw.skills.map(s => ({
        id: uid(), name: String(s.name || "未命名能力"),
        score: clamp(s.score, 0, 5),
        target: clamp(s.target != null ? s.target : num(s.score) + 1, 0, 5)
      }));
    }
    if (Array.isArray(raw.roadmap) && raw.roadmap.length) {
      next.roadmap = raw.roadmap.map((r, i) => ({
        id: uid(),
        term: r.term || (terms[Math.min(i, terms.length - 1)] || terms[0]).id,
        phase: PHASES.includes(r.phase) ? r.phase : "基础",
        title: String(r.title || "未命名阶段"),
        detail: String(r.detail || ""),
        done: !!r.done
      }));
    }
    if (Array.isArray(raw.tasks) && raw.tasks.length) {
      next.tasks = raw.tasks.map(t => ({
        id: uid(), title: String(t.title || "未命名任务"),
        category: String(t.category || "学习"),
        priority: PRIORITIES.includes(t.priority) ? t.priority : "中",
        date: t.date || "", done: !!t.done, est: num(t.est, 0), spent: num(t.spent, 0)
      }));
    }
    if (Array.isArray(raw.projects) && raw.projects.length) {
      next.projects = raw.projects.map(p => ({
        id: uid(), title: String(p.title || "未命名项目"),
        status: PROJECT_STATUS.includes(p.status) ? p.status : "构思",
        description: String(p.description || ""),
        skills: String(p.skills || ""), term: p.term || terms[0].id,
        link: "", outcome: "", startDate: "", endDate: ""
      }));
    }
    if (Array.isArray(raw.directions) && raw.directions.length) {
      next.directions = raw.directions.map(d => ({
        id: uid(), title: String(d.title || "方向"),
        description: String(d.description || ""),
        skills: Array.isArray(d.skills) ? d.skills.map(String) : [],
        jobs: "", prep: ""
      }));
    }
    if (raw.selectedDirection) next.selectedDirection = String(raw.selectedDirection);
    if (raw.notes && typeof raw.notes === "string" && raw.notes.trim()) {
      next.notes.unshift({
        id: uid(), title: "周复盘（自旧版迁移）", tags: "迁移",
        content: raw.notes.trim(), updatedAt: raw.weekStart || todayISO()
      });
    }
    if (Array.isArray(raw.weeks)) next.weeks = raw.weeks;
    if (raw.weekStart) next.weekStart = raw.weekStart;
    next.meta.migratedFrom = "v1";
    return next;
  }

  function normalize(raw) {
    if (!raw || typeof raw !== "object") return defaultData();
    if (num(raw.version, 1) >= 2) {
      const base = defaultData();
      const merged = { ...base, ...raw };
      merged.profile = { ...base.profile, ...(raw.profile || {}) };
      merged.settings = { ...base.settings, ...(raw.settings || {}) };
      merged.english = { ...base.english, ...(raw.english || {}) };
      merged.meta = { ...base.meta, ...(raw.meta || {}) };
      for (const key of ["courses", "roadmap", "skills", "projects", "tasks", "studyLog", "habits", "competitions", "papers", "milestones", "directions", "notes", "weeks"]) {
        if (!Array.isArray(merged[key])) merged[key] = base[key];
      }
      if (!Array.isArray(merged.english.plan)) merged.english.plan = base.english.plan;
      merged.courses = merged.courses.map(c => ({ id: c.id || uid(), teacher: "", ...c }));
      merged.roadmap = merged.roadmap.map(r => ({ id: r.id || uid(), ...r }));
      merged.skills = merged.skills.map(s => ({ id: s.id || uid(), target: num(s.target, num(s.score) + 1), ...s }));
      merged.projects = merged.projects.map(p => ({ id: p.id || uid(), ...p }));
      merged.tasks = merged.tasks.map(t => ({ id: t.id || uid(), ...t }));
      merged.habits = merged.habits.map(h => ({ id: h.id || uid(), log: h.log || {}, ...h }));
      merged.milestones = merged.milestones.map(m => ({ id: m.id || uid(), ...m }));
      merged.papers = merged.papers.map(p => ({ id: p.id || uid(), ...p }));
      merged.competitions = merged.competitions.map(c => ({ id: c.id || uid(), ...c }));
      merged.notes = merged.notes.map(n => ({ id: n.id || uid(), ...n }));
      merged.directions = merged.directions.map(d => ({
        id: d.id || uid(), jobs: "", prep: "", ...d,
        skills: Array.isArray(d.skills) ? d.skills : []
      }));
      return merged;
    }
    return migrate(raw);
  }

  function loadData() {
    try {
      const current = localStorage.getItem(STORAGE_KEY);
      if (current) return normalize(JSON.parse(current));
      for (const key of LEGACY_KEYS) {
        const legacy = localStorage.getItem(key);
        if (legacy) {
          const migrated = migrate(JSON.parse(legacy));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        }
      }
    } catch (error) {
      console.warn("读取本地数据失败，使用默认数据。", error);
    }
    return defaultData();
  }

  let data = loadData();
  let currentPage = "overview";
  let ui = { termFilter: "all", search: {}, toastTimer: null, courseSearch: "", paperFilter: "all" };

  function persist() {
    data.meta = data.meta || {};
    data.meta.lastSaved = todayISO();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      savedLabel = "已保存 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
      const el = document.getElementById("profileSaved");
      if (el) el.textContent = savedLabel;
    } catch (error) {
      toast("保存失败：浏览器存储空间可能已满");
      console.error(error);
    }
  }
  function save(message, rerender = true) {
    persist();
    if (rerender) render();
    if (message) toast(message);
  }
  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(ui.toastTimer);
    ui.toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  /* ============================================================
     4. 计算
     ============================================================ */
  function terms() { return termList(data.profile.enrollYear); }
  function termById(id) { return terms().find(t => t.id === id) || null; }
  function termLabel(id) { const t = termById(id); return t ? `${t.label}（${t.sub}）` : String(id || "—"); }
  function currentTerm() { return currentTermId(data.profile.enrollYear); }

  function courseStats(list) {
    const graded = list.filter(c => c.score !== null && c.score !== "" && Number.isFinite(Number(c.score)));
    let creditSum = 0, weighted = 0, gpSum = 0, gpCredit = 0;
    for (const c of graded) {
      const cr = num(c.credits, 0);
      const sc = clamp(c.score, 0, 100);
      creditSum += cr;
      weighted += sc * cr;
      gpSum += scoreToGp(sc) * cr;
      gpCredit += cr;
    }
    return {
      count: graded.length,
      credits: round(creditSum, 1),
      average: creditSum > 0 ? round(weighted / creditSum, 2) : 0,
      gpa: gpCredit > 0 ? round(gpSum / gpCredit, 3) : 0,
      totalCredits: round(list.reduce((s, c) => s + num(c.credits, 0), 0), 1)
    };
  }
  function remainingCredits() { return round(courseStats(data.courses).totalCredits, 1); }

  function roadmapByTerm() {
    const map = new Map();
    for (const t of terms()) map.set(t.id, []);
    for (const r of data.roadmap) {
      if (!map.has(r.term)) map.set(r.term, []);
      map.get(r.term).push(r);
    }
    return map;
  }
  function roadmapProgress() {
    const done = data.roadmap.filter(r => r.done).length;
    return { done, total: data.roadmap.length, percent: data.roadmap.length ? Math.round(done / data.roadmap.length * 100) : 0 };
  }
  function skillAverages() {
    if (!data.skills.length) return { now: 0, target: 0 };
    const now = data.skills.reduce((s, k) => s + num(k.score), 0) / data.skills.length;
    const target = data.skills.reduce((s, k) => s + num(k.target), 0) / data.skills.length;
    return { now: round(now, 2), target: round(target, 2) };
  }

  /* 时间账本 */
  function studyHoursBetween(fromISO, toISOStr) {
    const a = parseISO(fromISO), b = parseISO(toISOStr);
    if (!a || !b) return 0;
    return data.studyLog
      .filter(e => { const d = parseISO(e.date); return d && d >= a && d <= b; })
      .reduce((s, e) => s + num(e.hours), 0);
  }
  function weekStartISO(offsetWeeks = 0) {
    const now = new Date();
    const day = (now.getDay() + 6) % 7; /* 周一为一周开始 */
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + offsetWeeks * 7);
    return toISO(monday);
  }
  function weekEndISO(offsetWeeks = 0) {
    const s = parseISO(weekStartISO(offsetWeeks));
    return toISO(new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6));
  }
  function last7Days() {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const iso = toISO(d);
      const hours = data.studyLog.filter(e => e.date === iso).reduce((s, e) => s + num(e.hours), 0);
      out.push({ iso, label: ["日", "一", "二", "三", "四", "五", "六"][d.getDay()], hours: round(hours, 1) });
    }
    return out;
  }
  function last8Weeks() {
    const out = [];
    for (let i = 7; i >= 0; i--) {
      const s = weekStartISO(-i), e = weekEndISO(-i);
      out.push({ start: s, end: e, hours: round(studyHoursBetween(s, e), 1) });
    }
    return out;
  }
  function taskLoad() {
    const open = data.tasks.filter(t => !t.done);
    const est = open.reduce((s, t) => s + num(t.est, 0), 0);
    const high = open.filter(t => t.priority === "高").length;
    return { open: open.length, est: round(est, 1), high };
  }
  function nextMilestone() {
    const pending = data.milestones
      .filter(m => !m.done)
      .map(m => ({ ...m, days: daysFromToday(m.date) }))
      .filter(m => m.days !== null)
      .sort((a, b) => a.days - b.days);
    return pending[0] || null;
  }
  function upcomingMilestones(n = 4) {
    return data.milestones
      .filter(m => !m.done)
      .map(m => ({ ...m, days: daysFromToday(m.date) }))
      .filter(m => m.days !== null && m.days >= 0)
      .sort((a, b) => a.days - b.days)
      .slice(0, n);
  }
  function habitStreak(habit) {
    let streak = 0;
    const d = new Date();
    for (;;) {
      const iso = toISO(d);
      if (habit.log && habit.log[iso]) { streak++; d.setDate(d.getDate() - 1); }
      else if (iso === todayISO()) { d.setDate(d.getDate() - 1); } /* 今天未打不算断 */
      else break;
      if (streak > 3650) break;
    }
    return streak;
  }
  function todayMinutes() {
    return round(data.studyLog.filter(e => e.date === todayISO()).reduce((s, e) => s + num(e.hours), 0) * 60, 0);
  }
  /* ============================================================
     5. 通用组件（纯 SVG / CSS，无外部依赖）
     ============================================================ */
  function progressBar(percent, color = "") {
    const p = clamp(percent, 0, 100);
    return `<div class="progress-track" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-fill ${color}" style="width:${p}%"></div></div>`;
  }

  function ring(percent, opts = {}) {
    const size = opts.size || 78, stroke = opts.stroke || 8;
    const color = opts.color || "var(--green)";
    const p = clamp(percent, 0, 100);
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const off = c * (1 - p / 100);
    return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p)}%">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-soft)" stroke-width="${stroke}"></circle>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${round(c, 2)}" stroke-dashoffset="${round(off, 2)}"
        transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .3s ease"></circle>
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
        font-size="${size / 4.4}" font-weight="700" fill="var(--text)">${Math.round(p)}%</text>
    </svg>`;
  }

  function radarChart(list, size = 430) {
    const items = (list || []).filter(s => s && s.name);
    const n = items.length;
    if (n < 3) return `<div class="empty">至少需要 3 项能力才能绘制雷达图。请先添加能力项。</div>`;
    const cx = size / 2, cy = size / 2;
    const R = size / 2 - 72;
    const MAX = 5;
    const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
    const pt = (i, v) => {
      const a = ang(i), rr = R * clamp(v, 0, MAX) / MAX;
      return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
    };
    const poly = get => items.map((s, i) => pt(i, get(s)).map(v => round(v, 1)).join(",")).join(" ");
    let svg = `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px;display:block" role="img" aria-label="能力雷达图">`;
    for (let lvl = 1; lvl <= MAX; lvl++) {
      const rr = R * lvl / MAX;
      const pts = items.map((_, i) => {
        const a = ang(i);
        return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)].map(v => round(v, 1)).join(",");
      }).join(" ");
      svg += `<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1" ${lvl === MAX ? 'stroke-opacity="1"' : 'stroke-opacity=".7"'}></polygon>`;
    }
    items.forEach((_, i) => {
      const [x, y] = pt(i, MAX);
      svg += `<line x1="${cx}" y1="${cy}" x2="${round(x, 1)}" y2="${round(y, 1)}" stroke="var(--line)" stroke-width="1" stroke-opacity=".7"></line>`;
    });
    svg += `<polygon points="${poly(s => s.target)}" fill="none" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="5 4"></polygon>`;
    svg += `<polygon points="${poly(s => s.score)}" fill="var(--green)" fill-opacity=".18" stroke="var(--green)" stroke-width="2"></polygon>`;
    items.forEach((s, i) => {
      const [x, y] = pt(i, s.score);
      svg += `<circle cx="${round(x, 1)}" cy="${round(y, 1)}" r="3" fill="var(--green)"></circle>`;
    });
    items.forEach((s, i) => {
      const a = ang(i);
      const lx = cx + (R + 16) * Math.cos(a);
      const ly = cy + (R + 16) * Math.sin(a);
      const cosv = Math.cos(a), sinv = Math.sin(a);
      const anchor = Math.abs(cosv) < 0.3 ? "middle" : (cosv > 0 ? "start" : "end");
      const dy = sinv > 0.6 ? 10 : (sinv < -0.6 ? -1 : 4);
      svg += `<text x="${round(lx, 1)}" y="${round(ly + dy, 1)}" font-size="10.5" fill="var(--muted)" text-anchor="${anchor}">${escapeHtml(s.name)}</text>`;
    });
    svg += `</svg>`;
    return svg;
  }

  function barChart(items, opts = {}) {
    const valueKey = opts.valueKey || "hours";
    const labelKey = opts.labelKey || "label";
    const unit = opts.unit || "h";
    const max = opts.max || Math.max(1, ...items.map(i => num(i[valueKey])));
    return `<div class="bars">${items.map((item, i) => {
      const v = num(item[valueKey]);
      const h = max > 0 ? Math.max(v > 0 ? 4 : 0, Math.round(v / max * 100)) : 0;
      const soft = opts.highlightIndex != null && i !== opts.highlightIndex;
      return `<div class="bar-col" title="${escapeHtml(String(item[labelKey]))}：${v}${unit}">
        <span class="bar-value">${v > 0 ? v : ""}</span>
        <div class="bar-track"><div class="bar-fill ${soft ? "soft" : ""}" style="height:${h}%"></div></div>
        <span class="bar-label">${escapeHtml(String(item[labelKey]))}</span>
      </div>`;
    }).join("")}</div>`;
  }

  function tag(text, tone = "") {
    return `<span class="tag ${tone}">${escapeHtml(text)}</span>`;
  }
  const PHASE_TONE = { "数学": "blue", "编程": "green", "基础": "", "数据": "teal", "AI": "violet", "实践": "amber", "英语": "blue", "科研": "violet", "求职": "amber" };
  function phaseTag(phase) { return tag(phase, PHASE_TONE[phase] || ""); }
  function priorityTag(p) { return tag(p + "优先", p === "高" ? "red" : p === "中" ? "amber" : ""); }
  function statusTone(s) {
    return ({ "已完成": "green", "进行中": "blue", "已结束": "green", "构思": "", "已暂停": "amber", "待报名": "amber", "备赛中": "blue", "已参赛": "violet", "待读": "", "在读": "blue", "已读": "green", "精读": "violet" })[s] || "";
  }

  function countdownTag(days) {
    if (days === null || days === undefined) return "";
    if (days < 0) return tag(`已过 ${-days} 天`, "red");
    if (days === 0) return tag("就在今天", "amber");
    if (days <= 14) return tag(`还有 ${days} 天`, "amber");

  function sectionHeader(title, subtitle, actionsHtml = "") {

  function fieldHtml(f) {
    const span = f.span === 2 ? "span-2" : "";
    const id = "mf_" + f.name;
    const val = f.value == null ? "" : f.value;
    let control = "";
    if (f.type === "select") {
      control = `<select id="${id}" name="${f.name}">${(f.options || []).map(o => {
        const v = typeof o === "object" ? o.value : o;
        const l = typeof o === "object" ? o.label : o;
        return `<option value="${escapeHtml(v)}" ${String(v) === String(val) ? "selected" : ""}>${escapeHtml(l)}</option>`;
      }).join("")}</select>`;
    } else if (f.type === "textarea") {
      control = `<textarea id="${id}" name="${f.name}" placeholder="${escapeHtml(f.placeholder || "")}">${escapeHtml(val)}</textarea>`;
    } else {
      control = `<input id="${id}" name="${f.name}" type="${f.type || "text"}" value="${escapeHtml(val)}"
        placeholder="${escapeHtml(f.placeholder || "")}"
        ${f.min != null ? `min="${f.min}"` : ""} ${f.max != null ? `max="${f.max}"` : ""}
        ${f.step != null ? `step="${f.step}"` : ""} ${f.required ? "required" : ""}>`;
    }
    return `<div class="field ${span}"><label for="${id}">${escapeHtml(f.label || f.name)}${f.required ? " *" : ""}</label>
      ${control}${f.hint ? `<span class="hint">${escapeHtml(f.hint)}</span>` : ""}</div>`;
  }

  function openModal(config) {
    modalState = config;
    const backdrop = document.getElementById("modalBackdrop");
    const modal = document.getElementById("modal");
    const fields = config.fields || [];
    const head = `<div class="modal-head">
      <div><h2>${escapeHtml(config.title || "")}</h2>${config.subtitle ? `<div class="panel-subtitle">${escapeHtml(config.subtitle)}</div>` : ""}</div>
      <button type="button" class="button icon ghost" data-modal-close aria-label="关闭">✕</button>
    </div>`;
    const body = config.html
      ? config.html
      : `<form id="modalForm" novalidate>
          <div class="form-grid ${config.cols === 3 ? "cols-3" : ""}">${fields.map(fieldHtml).join("")}</div>
          <div class="form-actions">
            <button type="button" class="button" data-modal-close>取消</button>
            <button type="submit" class="button primary">${escapeHtml(config.submitLabel || "保存")}</button>
          </div>
        </form>`;
    modal.innerHTML = head + body;
    backdrop.classList.add("show");

    modal.querySelectorAll("[data-modal-close]").forEach(b => b.addEventListener("click", closeModal));
    const form = modal.querySelector("#modalForm");
    if (form) {
      form.addEventListener("submit", event => {
        event.preventDefault();
        const fd = new FormData(form);
        const values = {};
        for (const f of fields) {
          let v = fd.get(f.name);
          if (f.type === "number") v = (v === "" || v === null) ? null : Number(v);
          else v = typeof v === "string" ? v.trim() : v;
          values[f.name] = v;
        }
        const ok = config.onSubmit ? config.onSubmit(values) : true;
        if (ok !== false) closeModal();
      });
    }
    if (typeof config.onRender === "function") config.onRender(modal);
    const first = modal.querySelector("input,textarea,select");
    if (first && !config.noFocus) setTimeout(() => first.focus(), 40);
  }

    document.getElementById("modalBackdrop").classList.remove("show");

    else if (page === "projects") addProjectDialog();

    else if (page === "papers") addPaperDialog();

  function navigate(page) {
    if (!PAGES[page]) page = "overview";
    currentPage = page;
    document.getElementById("sidebar").classList.remove("open");
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function render() {
    const page = PAGES[currentPage] || PAGES.overview;
    document.getElementById("content").innerHTML = page.render();
    document.getElementById("breadcrumbCurrent").textContent = page.title;
    updateSidebar();
    if (typeof afterRender === "function") afterRender();
  }

  let savedLabel = "数据保存在本机浏览器";
  function updateSidebar() {
    document.querySelectorAll(".nav button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.page === currentPage);
    });
    const p = data.profile;
    document.getElementById("profileName").textContent = `${p.school} · ${p.major}`;
    document.getElementById("profileYear").textContent = `${p.grade} · ${p.campus}`;
    const badge = document.getElementById("navBadgeWeekly");
    const open = data.tasks.filter(t => !t.done).length;
    badge.textContent = String(open);
    const t = termById(currentTerm());
    document.getElementById("profileWeek").textContent = t ? `当前学期：${t.label}（${t.sub}）` : "";
    const el = document.getElementById("profileSaved");
    if (el) el.textContent = savedLabel;

    document.documentElement.setAttribute("data-theme", data.settings.theme === "dark" ? "dark" : "light");
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", data.settings.theme === "dark" ? "#141715" : "#f6f7f5");

  /* 事件委托：内容区统一处理 click / change / input / submit */
  function bindGlobalEvents() {
    document.getElementById("content").addEventListener("click", onContentClick);
    document.getElementById("content").addEventListener("change", onContentChange);
    document.getElementById("content").addEventListener("input", onContentInput);
    document.getElementById("content").addEventListener("submit", onContentSubmit);

    document.querySelectorAll(".nav button").forEach(btn => {
      btn.addEventListener("click", () => navigate(btn.dataset.page));
    });
    document.getElementById("menuButton").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("open");
    });
    document.getElementById("quickAdd").addEventListener("click", quickAdd);
    document.getElementById("modalBackdrop").addEventListener("click", event => {
      if (event.target.id === "modalBackdrop") closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        if (document.getElementById("modalBackdrop").classList.contains("show")) closeModal();
        else document.getElementById("sidebar").classList.remove("open");
      }
      if (event.altKey && !event.ctrlKey && !event.metaKey && /^[1-9]$/.test(event.key)) {
        const order = ["overview", "courses", "roadmap", "skills", "projects", "competitions", "papers", "weekly", "timelog"];
        const page = order[Number(event.key) - 1];
        if (page) { event.preventDefault(); navigate(page); }
      }
    });
  }

     10. 页面：学习路线
     ============================================================ */
  function renderRoadmap() {
    const rp = roadmapProgress();
    const map = roadmapByTerm();
    const filter = ui.roadmapTerm || "cur";
    const now = currentTerm();
    const listTerms = filter === "all"
      ? terms()
      : filter === "cur"
        ? terms().filter(t => t.id === now)
        : terms().filter(t => t.id === filter);

    const phaseCount = {};
    data.roadmap.forEach(r => { phaseCount[r.phase] = (phaseCount[r.phase] || 0) + 1; });

    return `
      <div class="page-head">
        <div>
          <h1>学习路线</h1>
          <p class="subtitle">按四年八个学期编排的成长路线：数学与编程打底，数据与 AI 逐步深入，最后落到科研、竞赛与求职。可以随时增删改。</p>
        </div>
        <div class="btn-row"><button class="button primary" data-action="add-roadmap">＋ 添加任务</button></div>
      </div>

      <div class="panel">
        ${sectionHeader("总体进度", `已完成 ${rp.done} 项，共 ${rp.total} 项`, `
          <div class="field" style="flex:0 0 170px">
            <select data-filter="roadmap-term">
              <option value="cur" ${filter === "cur" ? "selected" : ""}>当前学期</option>
              <option value="all" ${filter === "all" ? "selected" : ""}>全部学期</option>
              ${terms().map(t => `<option value="${t.id}" ${filter === t.id ? "selected" : ""}>${t.label}（${t.sub}）</option>`).join("")}
            </select>
          </div>`)}
        ${progressBar(rp.percent)}
        <div class="progress-legend"><span>完成度 ${rp.percent}%</span><span>${rp.done} / ${rp.total}</span></div>
        <div class="tag-row section-gap">
          ${PHASES.filter(ph => phaseCount[ph]).map(ph => {
            const items = data.roadmap.filter(r => r.phase === ph);
            const done = items.filter(r => r.done).length;
            return tag(`${ph} ${done}/${items.length}`, PHASE_TONE[ph] || "");
          }).join("")}
        </div>
      </div>

      ${listTerms.map(t => {
        const items = map.get(t.id) || [];
        if (!items.length) return "";
        const done = items.filter(r => r.done).length;
        const isNow = t.id === now;
        return `
        <section class="panel section-gap">
          <div class="panel-head">
            <div>
              <h2>${escapeHtml(t.label)} <span class="muted" style="font-weight:400">· ${escapeHtml(t.sub)}</span>${isNow ? ` ${tag("当前", "green")}` : ""}</h2>
              <div class="panel-subtitle">${done} / ${items.length} 项已完成</div>
            </div>
            <div class="panel-actions">
              ${progressBar(items.length ? Math.round(done / items.length * 100) : 0)}
              <button class="button small" data-add-roadmap-term="${t.id}">＋ 添加到本学期</button>
            </div>
          </div>
          <div class="list">
            ${items.map(item => `
              <div class="row row-cb2">
                <input type="checkbox" data-toggle="roadmap" data-id="${item.id}" ${item.done ? "checked" : ""}>
                <span>
                  <span class="row-title ${item.done ? "done" : ""}">${escapeHtml(item.title)}</span>
                  <span class="row-detail">${escapeHtml(item.detail || "—")}</span>
                </span>
                ${phaseTag(item.phase)}
                <span class="row-side">
                  <button class="button icon small" data-edit="roadmap" data-id="${item.id}" title="编辑">✎</button>
                  <button class="button icon small danger" data-del="roadmap" data-id="${item.id}" title="删除">×</button>
                </span>
              </div>`).join("")}
          </div>
        </section>`;
      }).join("")}

      ${listTerms.every(t => !(map.get(t.id) || []).length) ? `<div class="panel section-gap">${emptyRow("该学期还没有安排，点击右上角添加。")}</div>` : ""}`;
  }

  function renderSkills() {
    const sa = skillAverages();
    const gaps = data.skills
      .map(s => ({ ...s, gap: num(s.target) - num(s.score) }))
      .sort((a, b) => b.gap - a.gap);
    const weakest = gaps.slice(0, 3).filter(s => s.gap > 0);
    const strongest = [...gaps].sort((a, b) => b.score - a.score).slice(0, 3);

    return `
      <div class="page-head">
        <div>
          <h1>能力雷达</h1>
          <p class="subtitle">用滑块给自己打分，每学期复盘一次。评分请以「能不能独立做出东西」为准，而不是「听没听过」。</p>

      <section class="grid stats stats-3">
        <div class="stat-card accent-violet">
          <div class="stat-label">当前均分</div>

          <div class="stat-hint">共 ${data.skills.length} 个能力维度</div>
        </div>
        <div class="stat-card accent-amber">
          <div class="stat-label">目标均分</div>
          <div class="stat-value">${sa.target}<span class="unit"> / 5</span></div>
          <div class="stat-hint">与当前差距 ${round(sa.target - sa.now, 2)}</div>
        </div>
        <div class="stat-card accent-green">
          <div class="stat-label">最需补强</div>
          <div class="stat-value" style="font-size:17px">${weakest.length ? escapeHtml(weakest[0].name) : "—"}</div>
          <div class="stat-hint">${weakest.length ? `差距 ${weakest[0].gap} 分` : "各维度差距都不大"}</div>
        </div>
      </section>

      <section class="grid two-col">
        <div class="panel">
          ${sectionHeader("能力雷达图", "绿色实线＝当前水平，橙色虚线＝目标水平")}
          <div class="radar-box" id="radarBox">${radarChart(data.skills)}</div>
          <div class="sep"></div>
          <div class="grid two-col-even">
            <div>
              <div class="row-detail" style="margin-bottom:5px">💪 相对优势</div>
              <div class="tag-row">${strongest.map(s => tag(`${s.name} ${s.score}`, "green")).join("") || tag("—")}</div>
            </div>
            <div>
              <div class="row-detail" style="margin-bottom:5px">🎯 优先补强</div>
              <div class="tag-row">${weakest.map(s => tag(`${s.name} 差 ${s.gap}`, "amber")).join("") || tag("暂无")}</div>
            </div>
          </div>
        </div>

        <div class="panel">
          ${sectionHeader("自评明细", "0 未接触 · 1 知道概念 · 2 能跟做 · 3 能独立完成 · 4 能优化改进 · 5 能讲解/创新")}
          <div class="list scroll-y">
            ${data.skills.length ? data.skills.map(skill => `
              <div class="skill-row">
                <span class="skill-name">${escapeHtml(skill.name)}</span>
                <input type="range" min="0" max="5" step="1" value="${clamp(skill.score, 0, 5)}"
                  data-skill-slider="${skill.id}" aria-label="${escapeHtml(skill.name)} 当前水平">
                <span class="skill-score" id="score-${skill.id}">${clamp(skill.score, 0, 5)}<span class="muted"> /${clamp(skill.target, 0, 5)}</span></span>
              </div>`).join("") : emptyRow("还没有能力项。")}
          </div>
        </div>
      </section>

      <section class="panel section-gap">
        ${sectionHeader("能力项管理", "设置目标水平，用于判断学习优先级")}

          <table>
            <thead><tr><th style="min-width:180px">能力</th><th class="num">当前</th><th>水平描述</th><th class="num">目标</th><th class="num">差距</th><th class="col-tight"></th></tr></thead>
            <tbody>
              ${data.skills.map(s => {
                const gap = num(s.target) - num(s.score);
                return `<tr>
                  <td><span class="row-title">${escapeHtml(s.name)}</span></td>
                  <td class="num">${num(s.score)}</td>
                  <td class="muted">${escapeHtml(levelLabel(s.score))}</td>
                  <td class="num">${num(s.target)}</td>
                  <td class="num">${gap > 0 ? `<span class="tag amber">${gap}</span>` : `<span class="tag green">已达成</span>`}</td>
                  <td class="delete-cell">
                    <button class="button icon small" data-edit="skill" data-id="${s.id}" title="编辑">✎</button>
                    <button class="button icon small danger" data-del="skill" data-id="${s.id}" title="删除">×</button>

    if (next) {
      next.focus();
      if (pos != null && next.setSelectionRange) {
        try { next.setSelectionRange(pos, pos); } catch (error) { /* 忽略 */ }
      }
    }
  }

  function onContentClick(event) {
    const target = event.target;
    if (!target || typeof target.closest !== "function") return;
    const el = target.closest(
      "[data-go],[data-action],[data-del],[data-edit],[data-add-roadmap-term],[data-habit-toggle]," +
      "[data-pick-direction],[data-clear-direction],[data-week-load],[data-note-open],[data-note-tag]"
    );
    if (!el) return;

    if (el.dataset.go) { navigate(el.dataset.go); return; }

    if (el.dataset.noteTag) {
      ui.noteSearch = el.dataset.noteTag;
      render();
      return;
    }

    if (el.dataset.habitToggle) {
      const habit = findById(data.habits, el.dataset.habitToggle);
      if (!habit) return;
      habit.log = habit.log || {};
      const date = el.dataset.date;
      if (habit.log[date]) delete habit.log[date];
      else habit.log[date] = true;
      save();
      return;
    }

    if (el.dataset.pickDirection) {
      const title = el.dataset.pickDirection;
      data.selectedDirection = data.selectedDirection === title ? "" : title;
      data.profile.target = data.selectedDirection
        ? `深入了解「${data.selectedDirection}」并完成一个相关小项目`
        : data.profile.target;
      save("已更新重点探索方向");
      return;
    }

    if (el.hasAttribute("data-clear-direction")) {
      data.selectedDirection = "";
      save("已取消重点探索方向");
      return;
    }

    if (el.dataset.addRoadmapTerm) { addRoadmapDialog(null, el.dataset.addRoadmapTerm); return; }

    if (el.dataset.noteOpen) {
      const note = findById(data.notes, el.dataset.noteOpen);
      if (!note) return;
      openModal({
        title: note.title,
        subtitle: `标签：${note.tags || "无"} · 更新于 ${note.updatedAt || "—"}`,
        noFocus: true,
        html: `<div class="note-text">${escapeHtml(note.content || "")}</div>
          <div class="form-actions">
            <button type="button" class="button" data-modal-close>关闭</button>
            <button type="button" class="button primary" data-note-edit="${note.id}">编辑</button>
          </div>`,
        onRender(modal) {
          const btn = modal.querySelector("[data-note-edit]");
          if (btn) btn.addEventListener("click", () => { closeModal(); setTimeout(() => noteDialog(note), 80); });
        }
      });
      return;
    }

    if (el.dataset.weekLoad) {
      const entry = getWeekEntry(el.dataset.weekLoad);
      if (!entry) return;
      openModal({
        title: `${entry.start} 起这一周的复盘`,
        noFocus: true,
        html: `<div class="field"><label>完成了什么</label><div class="note-text">${escapeHtml(entry.done || "—")}</div></div>
          <div class="sep"></div>
          <div class="field"><label>困难 / 原因</label><div class="note-text">${escapeHtml(entry.blocker || "—")}</div></div>
          <div class="sep"></div>
          <div class="field"><label>下周调整</label><div class="note-text">${escapeHtml(entry.next || "—")}</div></div>
          <div class="form-actions">
            <button type="button" class="button danger" data-week-del="${entry.id}">删除这条复盘</button>
            <button type="button" class="button primary" data-modal-close>关闭</button>
          </div>`,
        onRender(modal) {
          const btn = modal.querySelector("[data-week-del]");
          if (btn) btn.addEventListener("click", () => {
            data.weeks = data.weeks.filter(w => w.id !== entry.id);
            closeModal();
            save("已删除复盘记录");
          });
        }
      });
      return;
    }

    if (el.dataset.del) {
      const kind = el.dataset.del;
      const id = el.dataset.id;
      if (kind === "english-plan") {
        data.english.plan = data.english.plan.filter(p => p.id !== id);
        save("已删除计划项");
        return;
      }
      const key = DEL_MAP[kind];
      if (!key) return;
      if (!confirm(`确定删除这条${DEL_LABEL[kind] || "记录"}吗？此操作不可撤销。`)) return;
      data[key] = data[key].filter(item => item.id !== id);
      if (kind === "direction" && data.selectedDirection && !data.directions.some(d => d.title === data.selectedDirection)) {
        data.selectedDirection = "";
      }
      save("已删除");
      return;
    }

    if (el.dataset.edit) {
      const kind = el.dataset.edit;
      const id = el.dataset.id;
      const map = { course: data.courses, roadmap: data.roadmap, skill: data.skills, project: data.projects, task: data.tasks, competition: data.competitions, paper: data.papers, milestone: data.milestones, note: data.notes, direction: data.directions };
      const item = findById(map[kind], id);
      if (!item) return;
      if (kind === "course") addCourseDialog(item);
      else if (kind === "roadmap") addRoadmapDialog(item);
      else if (kind === "skill") addSkillDialog(item);
      else if (kind === "project") addProjectDialog(item);
      else if (kind === "task") addTaskDialog(item);
      else if (kind === "competition") addCompetitionDialog(item);
      else if (kind === "paper") addPaperDialog(item);
      else if (kind === "milestone") addMilestoneDialog(item);
      else if (kind === "note") noteDialog(item);
      else if (kind === "direction") directionDialog(item);
      return;
    }

    if (el.dataset.action) {
      const action = el.dataset.action;
      if (action === "add-course") addCourseDialog();
      else if (action === "add-roadmap") addRoadmapDialog();
      else if (action === "add-skill") addSkillDialog();
      else if (action === "add-project") addProjectDialog();
      else if (action === "add-task") addTaskDialog();
      else if (action === "add-competition") addCompetitionDialog();
      else if (action === "add-paper") addPaperDialog();
      else if (action === "add-milestone") addMilestoneDialog();
      else if (action === "add-note") noteDialog();
      else if (action === "add-habit") addHabitDialog();
      else if (action === "log-study") addStudyLogDialog();
      else if (action === "add-english-plan") addEnglishPlanDialog();
      else if (action === "toggle-done") { data.settings.showDone = !(data.settings.showDone !== false); save(); }
      else if (action === "theme-light") { data.settings.theme = "light"; applyTheme(); save("已切换到浅色主题"); }
      else if (action === "theme-dark") { data.settings.theme = "dark"; applyTheme(); save("已切换到深色主题"); }
      else if (action === "export") exportData();
      else if (action === "import") document.getElementById("importFile").click();
      else if (action === "print") window.print();
      else if (action === "clear-studylog") {
        if (!confirm("确定清空全部时间记录吗？")) return;
        data.studyLog = [];
        save("时间记录已清空");
      } else if (action === "carry-over") {
        const open = data.tasks.filter(t => !t.done);
        const overdue = open.filter(t => t.date && daysFromToday(t.date) < 0);
        toast(`未完成 ${open.length} 项，其中逾期 ${overdue.length} 项，建议下周优先安排`);
      } else if (action === "reset-empty") {
        if (!confirm("清空所有内容，仅保留个人档案与设置？请先导出备份。")) return;
        const profile = structuredClone(data.profile);
        const settings = structuredClone(data.settings);
        data = blankData();
        data.profile = profile;
        data.settings = settings;
        save("已清空为空白模板");
      } else if (action === "reset-default") {
        if (!confirm("恢复为默认示例数据？当前所有内容将被覆盖，请先导出备份。")) return;
        data = defaultData();
        applyTheme();
        save("已恢复默认示例数据");
      }
    }
  }

  function onContentChange(event) {
    const el = event.target;
    const d = el.dataset;

    if (d.toggle === "task" || d.toggle === "roadmap") {
      const list = d.toggle === "task" ? data.tasks : data.roadmap;
      const item = findById(list, d.id);
      if (!item) return;
      item.done = el.checked;
      save(item.done ? "已完成 ✓" : "已取消完成");
      return;
    }

    if (d.courseScore !== undefined) {
      const course = findById(data.courses, d.courseScore);
      if (!course) return;
      const v = el.value.trim();
      course.score = v === "" ? null : clamp(num(v), 0, 100);
      if (course.score !== null) course.status = "已完成";
      save("成绩已更新");
      return;
    }
    if (d.courseStatus !== undefined) {
      const course = findById(data.courses, d.courseStatus);
      if (!course) return;
      course.status = el.value;
      save("状态已更新");
      return;
    }
    if (d.projectStatus !== undefined) {
      const item = findById(data.projects, d.projectStatus);
      if (!item) return;
      item.status = el.value;
      save("项目状态已更新");
      return;
    }
    if (d.compStatus !== undefined) {
      const item = findById(data.competitions, d.compStatus);
      if (!item) return;
      item.status = el.value;
      save("状态已更新");
      return;
    }
    if (d.paperStatus !== undefined) {
      const item = findById(data.papers, d.paperStatus);
      if (!item) return;
      item.status = el.value;
      save("阅读状态已更新");
      return;
    }
    if (d.milestoneDone !== undefined) {
      const item = findById(data.milestones, d.milestoneDone);
      if (!item) return;
      item.done = el.checked;
      save(item.done ? "里程碑已完成 🎉" : "已取消完成");
      return;
    }
    if (d.english !== undefined) {
      const block = data.english[d.english];
      if (!block) return;
      const field = d.field;
      if (field === "done") block.done = el.checked;
      else block[field] = el.value.trim();
      save("已保存");
      return;
    }
    if (d.englishPlan !== undefined) {
      const item = data.english.plan.find(p => p.id === d.englishPlan);
      if (!item) return;
      item.done = el.checked;
      save();
      return;
    }
    if (d.filter) {
      const f = d.filter;
      if (f === "course-term") { ui.termFilter = el.value; render(); }
      else if (f === "roadmap-term") { ui.roadmapTerm = el.value; render(); }
      else if (f === "project-status") { ui.projectFilter = el.value; render(); }
      else if (f === "paper-status") { ui.paperFilter = el.value; render(); }
    }
  }

  function onContentInput(event) {
    const el = event.target;
    const d = el.dataset;

    if (d.skillSlider) {
      const skill = findById(data.skills, d.skillSlider);
      if (!skill) return;
      skill.score = clamp(num(el.value), 0, 5);
      const label = document.getElementById("score-" + skill.id);
      if (label) label.innerHTML = `${skill.score}<span class="muted"> /${clamp(skill.target, 0, 5)}</span>`;
      const box = document.getElementById("radarBox");
      if (box) box.innerHTML = radarChart(data.skills);
      persist();
      return;
    }

    if (d.filter === "course-search") { ui.courseSearch = el.value; rerenderKeepFocus(el); return; }
    if (d.filter === "note-search") { ui.noteSearch = el.value; rerenderKeepFocus(el); return; }
    if (d.filter === "task-search") { ui.taskSearch = el.value; rerenderKeepFocus(el); return; }
  }

  function onContentSubmit(event) {
    const form = event.target;

    if (form.id === "weekReviewForm") {
      event.preventDefault();
      const start = form.dataset.weekStart;
      const fd = new FormData(form);
      let entry = getWeekEntry(start);
      if (!entry) { entry = { id: uid(), start, end: weekEndISO() }; data.weeks.push(entry); }
      entry.done = String(fd.get("done") || "").trim();
      entry.blocker = String(fd.get("blocker") || "").trim();
      entry.next = String(fd.get("next") || "").trim();
      entry.hours = round(studyHoursBetween(start, weekEndISO()), 1);
      entry.updatedAt = todayISO();
      save("本周复盘已保存");
      return;
    }

    if (form.id === "profileForm") {
      event.preventDefault();
      const fd = new FormData(form);
      const p = data.profile;
      p.name = String(fd.get("name") || "").trim();
      p.school = String(fd.get("school") || "").trim() || "四川大学";
      p.college = String(fd.get("college") || "").trim();
      p.major = String(fd.get("major") || "").trim() || "人工智能";
      p.grade = String(fd.get("grade") || "大一");
      p.campus = String(fd.get("campus") || "").trim();
      p.enrollYear = clamp(num(fd.get("enrollYear"), 2026), 2000, 2100);
      p.weeklyHours = clamp(num(fd.get("weeklyHours"), 15), 1, 80);
      p.gpaGoal = clamp(num(fd.get("gpaGoal"), 3.8), 0, 4);
      p.advisor = String(fd.get("advisor") || "").trim();
      p.target = String(fd.get("target") || "").trim();
      save("个人档案已保存");
      return;
    }
  }

  function directionDialog(item) {
    const editing = !!item;
    openModal({
      title: editing ? "编辑方向" : "添加方向",
      fields: [
        { name: "title", label: "方向名称", value: item ? item.title : "", required: true },
        { name: "description", label: "方向说明", type: "textarea", span: 2, value: item ? item.description : "" },
        { name: "skills", label: "需要的能力（逗号分隔）", span: 2, value: item && Array.isArray(item.skills) ? item.skills.join(", ") : "" },
        { name: "jobs", label: "典型岗位", span: 2, value: item ? item.jobs : "", placeholder: "如：算法工程师、数据分析师" },
        { name: "prep", label: "准备路径", type: "textarea", span: 2, value: item ? item.prep : "" }
      ],
      onSubmit(v) {
        if (!v.title) { toast("请填写方向名称"); return false; }
        const payload = {
          title: v.title, description: v.description,
          skills: String(v.skills || "").split(/[,，]/).map(s => s.trim()).filter(Boolean),
          jobs: v.jobs, prep: v.prep
        };
        if (editing) Object.assign(item, payload);
        else data.directions.push({ id: uid(), ...payload });
        save(editing ? "方向已更新" : "方向已添加");
      }
    });
  }

  function addEnglishPlanDialog() {
    openModal({
      title: "添加备考计划项",
      fields: [{ name: "text", label: "计划内容", required: true, placeholder: "如：每天背 30 个单词" }],
      onSubmit(v) {
        if (!v.text) { toast("请填写内容"); return false; }
        data.english.plan.push({ id: uid(), text: v.text, done: false });
        save("已添加计划项");
      }
    });
  }

  /* ============================================================
     23. 导入 / 导出 / 打印
     ============================================================ */
  function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `AI工作台备份-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("备份已导出到下载文件夹");
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || typeof parsed !== "object") throw new Error("格式不正确");
        data = normalize(parsed);
        applyTheme();
        save("数据导入成功");
      } catch (error) {
        alert("导入失败：" + error.message);
      }
    };
    reader.onerror = () => alert("读取文件失败");
    reader.readAsText(file, "utf-8");
  }

  function blankData() {
    const base = defaultData();
    return {
      ...base,
      courses: [], roadmap: [], skills: [], projects: [], tasks: [],
      studyLog: [], habits: [], competitions: [], papers: [],
      milestones: [], directions: [], selectedDirection: "",
      english: { ...base.english, plan: [] },
      notes: [], weeks: []
    };
  }

  /* ============================================================
     24. 番茄钟
     ============================================================ */
  const TIMER_RING = 188.5; /* 2πr, r = 30 */
  const timer = { phase: "focus", total: 25 * 60, remain: 25 * 60, running: false, handle: null, rounds: 0 };

  function timerFmt(sec) {
    const s = Math.max(0, Math.round(sec));
    return `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`;
  }
  function timerUpdateUI() {
    const timeEl = document.getElementById("timerTime");
    const phaseEl = document.getElementById("timerPhase");
    const ringEl = document.getElementById("timerRing");
    const btn = document.getElementById("timerStartPause");
    const meta = document.getElementById("timerMeta");
    if (!timeEl) return;
    timeEl.textContent = timerFmt(timer.remain);
    const pct = timer.total ? timer.remain / timer.total : 0;
    if (ringEl) {
      ringEl.setAttribute("stroke-dashoffset", String(round(TIMER_RING * (1 - pct), 2)));
      ringEl.setAttribute("stroke", timer.phase === "focus" ? "var(--green)" : "var(--blue)");
    }
    if (phaseEl) phaseEl.textContent = timer.phase === "focus" ? "专注中" : "休息一下";
    if (btn) btn.textContent = timer.running ? "暂停" : (timer.remain === timer.total ? "开始" : "继续");
    if (meta) meta.textContent = `今日专注 ${todayMinutes()} 分钟 · 已完成 ${timer.rounds} 轮`;
  }
  function timerSet(minutes, phase) {
    timer.phase = phase || "focus";
    timer.total = Math.max(1, Math.round(minutes * 60));
    timer.remain = timer.total;
    timerUpdateUI();
  }
  function timerToggle() {
    timer.running = !timer.running;
    if (timer.running) {
      timer.handle = setInterval(() => {
        timer.remain -= 1;
        if (timer.remain <= 0) {
          clearInterval(timer.handle);
          timer.running = false;
          timer.remain = 0;
          timerUpdateUI();
          if (timer.phase === "focus") {
            timer.rounds += 1;
            toast("专注结束，起来活动 5 分钟 ☕");
            timerSet(5, "break");
          } else {
            toast("休息结束，开始下一轮专注");
            timerSet(25, "focus");
          }
          return;
        }
        timerUpdateUI();
      }, 1000);
    } else {
      clearInterval(timer.handle);
    }
    timerUpdateUI();
  }
  function timerReset() {
    clearInterval(timer.handle);
    timer.running = false;
    timerSet(timer.phase === "focus" ? 25 : 5, timer.phase);
    toast("计时器已重置");
  }
  function timerLogSession() {
    const elapsed = timer.total - timer.remain;
    const minutes = Math.max(1, Math.round(elapsed / 60));
    const hours = round(minutes / 60, 2);
    data.studyLog.push({
      id: uid(), date: todayISO(), hours,
      subject: "专注计时", note: `番茄钟 ${minutes} 分钟`
    });
    save(`已记入 ${minutes} 分钟专注时间`);
  }
  function timerInit() {
    document.getElementById("timerToggle").addEventListener("click", () => {
      document.getElementById("timerWidget").classList.toggle("show");
    });
    document.getElementById("timerStartPause").addEventListener("click", timerToggle);
    document.getElementById("timerReset").addEventListener("click", timerReset);
    document.getElementById("timerLog").addEventListener("click", timerLogSession);
    document.getElementById("timerDuration").addEventListener("change", event => {
      timerSet(num(event.target.value, 25), "focus");
      toast(event.target.value + " 分钟专注已就绪");
    });
    timerUpdateUI();
  }

  /* ============================================================
     25. 启动
     ============================================================ */
  function afterRender() {
    /* 预留：渲染后的轻量副作用（当前由事件委托覆盖） */
  }

  function boot() {
    applyTheme();
    /* 先渲染首屏：即使后面某个可选控件缺失，也不会整页空白 */
    render();
    bindGlobalEvents();

    document.getElementById("themeToggle").addEventListener("click", () => {
      data.settings.theme = data.settings.theme === "dark" ? "light" : "dark";
      applyTheme();
      save(data.settings.theme === "dark" ? "已切换到深色主题" : "已切换到浅色主题");
    });
    document.getElementById("exportButton").addEventListener("click", exportData);

    /* 导入走事件委托，元素被重新渲染也依然有效 */
    document.addEventListener("change", event => {
      if (event.target && event.target.id === "importFile") {
        const file = event.target.files && event.target.files[0];
        if (file) importData(file);
        event.target.value = "";
      }
    });

    timerInit();
    persist();
  }

  boot();
  </script>
</body>
